<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Cambiata</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/common.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="container-fluid background-overlay min-vh-100 d-flex justify-content-center align-items-center">
    <div class="text-center bg-dark p-5 rounded shadow" style="max-width: 500px; width: 100%;">
        <h2 class="mb-3 text-success">Password Aggiornata!</h2>
        <p class="mb-4">La tua password è stata modificata con successo.</p>
        <a th:href="@{/userProfile}" class="btn btn-outline-light">Torna al Profilo</a>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

</body>
</html>
