<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ProfiloUtente - SiwBooks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/common.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>


    <div class="container-fluid background-overlay p-0">
        <div class="row align-items-center justify-content-center min-vh-100 d-flex w-100">
            <div class="card shadow-lg p-4 bg-dark rounded-4" style="max-width: 600px; width: 100%;">
                <div class="card-body text-center">
                    <h1 class="card-title mb-4 text-white"
                        th:text="'Profilo di ' + ${user.user.name} + ' ' + ${user.user.surname}"></h1>
                    <ul class="list-group list-group-flush mb-4 text-start">
                        <figure class="image profile-image mb-4" style="width: 120px; height: 120px; margin: 0 auto;">
							<img class="is-rounded"
								th:src="@{/images/avatar-svgrepo-com.svg}">
						</figure>
                        <li class="list-group-item bg-dark text-white" >
                            <h3 th:text="'👤 Username: ' + ${userDetails.username}"></h3>
                        </li>
                        <li class="list-group-item bg-dark text-white">
                            <h3 th:text="'📧 E-mail: ' + ${user.user.email}"></h3>
                        </li>
                        <li class="list-group-item bg-dark text-white">
                            <h3 th:text="'🔑 Ruolo: ' + ${user.role}"></h3>
                        </li>
                    </ul>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                        <form method="GET" th:action="@{/userProfile/changePass}">
                            <button type="submit" class="btn btn-light btn-lg px-4">
                                Modifica Password
                            </button>
                        </form>
                        <form method="" 
                            onsubmit="return confirm('Sei sicuro di voler cancellare l\'utente?');">
                            <button type="submit" class="btn btn-danger btn-lg px-4">
                                Cancella Utente
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
