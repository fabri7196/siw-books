<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta caharset="UTF-8">
    <title>Author-SiwBooks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/book.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container-fluid justify-content-center align-items-center background-overlay min-vh-100 d-flex">
        <div class="card shadow-lg border-0 rounded-4 p-4 w-100 my-4 mx-auto" style="max-width: 500px;">

            <!-- Foto Autore -->
            <div th:if="${author.photo != null}" class="d-flex justify-content-center mb-4">
                <img th:src="@{${author.photo.path}}" alt="Foto autore" class="rounded-circle shadow"
                    style="width: 180px; height: 180px; object-fit: cover; border: 3px solid #ddd;" />
            </div>

            <!-- Info Autore -->
            <div class="text-center">
                <h2 class="fw-bold" th:text="${author.name} + ' ' + ${author.surname}">Nome Cognome</h2>
                <p class="text-muted mb-1" th:text="'Anno di nascita: ' + ${author.dateOfBirth}"></p>
                <p th:if="${author.dateOfDeath != null}" class="text-muted mb-1"
                    th:text="'Anno di morte: ' + ${author.dateOfDeath}"></p>
                <p class="text-muted mb-1" th:text="'Nazionalità: ' + ${author.nationality}"></p>
            </div>

        </div>

    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
