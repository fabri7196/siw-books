<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="/css/common.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid background-overlay">
        <div class="row justify-content-center min-vh-100 align-items-center">
            <div class="col-md-4">
                <div class="card shadow rounded-3">
                    <div class="card-header text-center">
                        <h4>Registrazione Nuovo Utente</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/register}" method="POST">
                            <div class="mb-3">
                                <label for="name" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="name" required th:field="${user.name}">
                            </div>
                            <div class="mb-3">
                                <label for="surname" class="form-label">Cognome</label>
                                <input type="text" class="form-control" id="surname" required
                                    th:field="${user.surname}">
                            </div>
                            <div class="mb-3">
                                <!-- type="email" -->
                                <label for="email" class="form-label">Email</label>
                                <input type="text" class="form-control" id="email" required th:field="${user.email}">
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required
                                    th:field="${credentials.username}">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required
                                    th:field="${credentials.password}">
                            </div>
                            <button type="submit" class="btn btn-success w-100">Registrati</button>
                            <a th:href="@{/login}" class="btn btn-outline-secondary w-100 mt-2">Torna al Login</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

</body>

</html>
