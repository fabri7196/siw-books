<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>UtentiRegistrati - SiwBooks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/common.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <main class="main-content container-fluid background-overlay p-2 min-vh-100 py-5">
        <h2 class="mb-4">Elenco Utenti Registrati</h2>

        <div th:if="${#lists.isEmpty(users)}" class="alert alert-info">
            Nessun utente registrato.
        </div>

        <table th:if="${!#lists.isEmpty(users)}" class="table table-hover table-bordered shadow rounded">
            <thead class="table-success">
                <tr>
                    <th>Username</th>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Email</th>
                    <th>Ruolo</th>
                    <th>Numero recensioni</th>
                    <th>Azione</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user, stat : ${users}">
                    <td class="bg-transparent" th:text="${user.credentials.username}">Username</td>
                    <td class="bg-transparent" th:text="${user.name}">Nome</td>
                    <td class="bg-transparent" th:text="${user.surname}">Nome</td>
                    <td class="bg-transparent" th:text="${user.email}">Email</td>
                    <td class="bg-transparent" th:text="${user.credentials.role}">Ruolo</td>
                    <td class="bg-transparent">
                        <a href="" th:text="${numberReviews[__${stat.index}__]}" onmouseover="this.style.textDecoration='underline';" 
                            onmouseout="this.style.textDecoration='none';" style="text-decoration: none; color: black;">
                        </a>
                   </td>
                    <td class="p-0 align-middle bg-transparent">
                        <form th:action="@{'/users/delete/' + ${user.id}}" method="post" th:object="${user}"
                            onsubmit="return confirm('Sei sicuro di voler eliminare questo utente?');" class="d-grid">
                            <input type="hidden" name="_method" value="post" />
                            <button type="submit" class="btn btn-sm w-100 rounded-0">Elimina</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

</body>

</html>
