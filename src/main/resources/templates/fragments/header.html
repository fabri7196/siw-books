<header th:fragment="header">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-0">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <img src="/images/logo.jpg" alt="Siw Books" width="75" height="75" class="d-inline-block align-text-top">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${requestURI == '/home'} ? ' active' : ''" aria-current="page" th:href="@{/home}">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" th:classappend="${requestURI == '/formNewBook'} ? ' active' : ''" role="button" data-bs-toggle="dropdown">
                            Operazioni
                        </a>
                        <ul class="dropdown-menu bg-dark">
                            <li>
                                <a class="dropdown-item" th:href="@{/formNewBook}" style="--bs-dropdown-link-hover-bg: #198754; color: antiquewhite;">Aggiungi un libro</a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown" th:if="${user != null and user.role == 'ADMIN'}">
                        <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">
                            Operazioni Su Utenti
                        </a>
                        <ul class="dropdown-menu bg-dark">
                            <li>
                                <a class="dropdown-item" th:href="@{/AllUsers}" style="--bs-dropdown-link-hover-bg: #198754; color: antiquewhite;">Rimuovi Utenti</a>
                            </li>
                        </ul>
                    </li>
                </ul>
                
                <!-- Sezione destra (ricerca + profilo) -->
                <form class="d-flex me-3" role="search" method="GET" th:action="@{/home/searchBooks}">
                    <input class="form-control me-2" type="search" name="title" placeholder="Inserisci titolo libro" aria-label="Search" />
                    <button class="btn btn-outline-info" type="submit">Ricerca</button>
                </form>

                <div class="btn-group" role="group" aria-label="Button group with nested dropdown">
                    <a class="nav-link dropdown-toggle text-white" role="button" data-bs-toggle="dropdown">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                        </svg>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end bg-dark">
                        <li th:if="${userDetails != null}">
                            <a class="dropdown-item" th:href="@{/userProfile}" style="--bs-dropdown-link-hover-bg: #198754; color: antiquewhite;">Profile</a>
                        </li>
                        <li th:unless="${user}">
                            <a class="dropdown-item" th:href="@{/login}" style="--bs-dropdown-link-hover-bg: #198754; color: antiquewhite;">Login</a>
                        </li>
                        <li th:if="${userDetails != null}">
                            <form class="dropdown-item" th:action="@{/logout}" method="POST" style="--bs-dropdown-link-hover-bg: #198754; color: antiquewhite;">
                                <button type="submit" class="btn btn-link nav-link">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</header>
