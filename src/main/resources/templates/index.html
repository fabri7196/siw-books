<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benvenuto - SiwBooks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/index.css" />
  <link rel="stylesheet" href="/css/common.css" />
</head>

<body class="background-overlay">

  <div class="container d-flex justify-content-center align-items-center h-100">
    <div class="welcome-card text-center">
      <h1 class="mb-3">
        <i class="bi bi-book-half me-2"></i>
        Benvenuto su <strong>SiwBooks</strong>
      </h1>
      <p class="text-muted mb-4">
        SiwBooks è un'applicazione web per la gestione di libri e dei loro autori.<br/>
        Puoi consultarli, aggiungere nuovi libri e autori.
      </p>
      <p class="lead mb-5 text-secondary">Scegli come desideri procedere:</p>
      <div class="d-flex flex-column flex-md-row justify-content-center gap-3">
        <a th:href="@{/home}" class="btn btn-custom">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entra nel sito
        </a>
        <a th:href="@{/login}" class="btn btn-custom" th:if="${user == null}">
          <i class="bi bi-person-circle me-2"></i>Login / Registrati
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
