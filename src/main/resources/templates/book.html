<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Book - SiwBooks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/book.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='%23000' viewBox='0 0 16 16'%3E%3Cpath d='M11.354 1.354a.5.5 0 0 1 0 .707L6.707 6.707l4.647 4.646a.5.5 0 0 1-.708.708l-5-5a.5.5 0 0 1 0-.708l5-5a.5.5 0 0 1 .708 0z'/%3E%3C/svg%3E");
        }

        .carousel-control-next-icon {
            transform: rotate(180deg);
        }

    </style>
</head>

<body>

    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container-fluid justify-content-center align-items-center background-overlay min-vh-100 d-flex">
        <div class="card shadow-lg border-0 rounded-4 p-4 w-100 my-4" style="max-width: 800px;">

            <!-- Galleria di copertine -->
            <div th:if="${book.covers != null and !book.covers.isEmpty()}" class="mb-4">
                <div id="carouselCovers" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner text-center">
                        <div class="carousel-item active" th:if="${book.covers.size() > 0}">
                            <a th:href="${book.covers[0].path}" target="_blank">
                                <img th:src="${book.covers[0].path}"
                                    class="rounded border border-2 img-fluid"
                                    style="width: 180px; height: 270px; object-fit: cover;" alt="Copertina 1">
                            </a>
                        </div>
                        <div class="carousel-item" th:each="cover, iterStat : ${book.covers}"
                            th:if="${iterStat.index > 0}">
                            <a th:href="${cover.path}" target="_blank">
                                <img th:src="${cover.path}" class="rounded border border-2 img-fluid"
                                    style="width: 180px; height: 270px; object-fit: cover;"
                                    th:alt="'Copertina ' + ${iterStat.index + 1}">
                            </a>
                        </div>
                    </div>
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselCovers" data-bs-slide-to="0"
                            class="active"></button>
                        <button type="button" data-bs-target="#carouselCovers" data-bs-slide-to="1"
                            th:each="cover, iterStat : ${book.covers}" th:if="${iterStat.index > 0}"
                            th:attr="data-bs-slide-to=${iterStat.index}"></button>
                    </div>


                    <!-- Controlli del carousel -->
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselCovers"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Precedente</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselCovers"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Successiva</span>
                    </button>
                </div>
            </div>


            <!-- Info Libro -->
            <div class="text-center">
                <h2 class="fw-bold" th:text="${book.title}">Titolo Libro</h2>
                <p class="text-muted mb-1" th:text="'Anno pubblicazione: ' + ${book.year_publication}"></p>
                <p class="text-muted mb-3">Autori:
                    <span th:if="${#lists.isEmpty(book.authors)}" class="text-muted mb-3">Nessun autore disponibile.</span>
                    <a th:each="author : ${book.authors}" th:href="@{'/author/' + ${author.id}}" th:text="${author.name + ' ' + author.surname + '&nbsp;&nbsp;'}" style="text-decoration: none; color:black"></a>
                    <a th:if="${user != null and user.role == 'ADMIN'}" th:href="@{'/' + ${book.id} + '/addAuthorsToBook'}" class="ms-2 text-decoration-none" style="color:black; font-size: x-small;" >aggiungi/rimuovi autori</a>
                </p>
            </div>

            <hr class="my-4">

            <!-- Recensioni -->
            <div class="text-start">
                <h4 class="mb-3">
                    📝 Recensioni
                    <small class="text-muted">(<span th:text="${numReviews}">0</span>)</small>
                </h4>

                <p th:if="${#lists.isEmpty(book.reviews)}" class="fst-italic text-muted">Nessuna recensione disponibile.
                </p>

                <div th:each="review : ${book.reviews}" class="review-card position-relative p-3 mb-4 border rounded">
                    <h5 class="mb-1 fw-semibold" th:text="${review.title}"></h5>
                    <p class="mb-2" th:text="${review.text}"></p>
                    <div class="d-flex justify-content-between align-items-center small text-muted">

                        <!-- Stelle -->
                        <div>
                            <span th:each="i : ${#numbers.sequence(1,5)}">
                                <svg th:if="${i <= review.vote}" xmlns="http://www.w3.org/2000/svg" width="16"
                                    height="16" fill="#FFD700" class="bi bi-star-fill" viewBox="0 0 16 16">
                                    <path
                                        d="M3.612 15.443c-.396.198-.86-.106-.746-.592l.83-4.73L.173 6.765c-.329-.32-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.63.282.95l-3.523 3.356.83 4.73c.114.486-.35.79-.746.592L8 13.187l-4.389 2.256z" />
                                </svg>
                                <svg th:if="${i > review.vote}" xmlns="http://www.w3.org/2000/svg" width="16"
                                    height="16" fill="#ccc" class="bi bi-star" viewBox="0 0 16 16">
                                    <path
                                        d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.32.16-.888-.282-.95l-4.898-.696-2.184-4.327c-.197-.39-.73-.39-.927 0L5.354 6.118l-4.898.696c-.441.062-.612.63-.283.95l3.523 3.356-.83 4.73z" />
                                </svg>
                            </span>
                        </div>
                        <span th:text="'Autore: ' + ${review.author.credentials.username}"></span>
                        <div class="position-absolute top-0 end-0 m-2" th:if="${user != null and user.role == 'ADMIN'}">
                            <form th:action="@{'/book/' + ${book.id} + '/' + ${review.id} +'/removeReview'}"
                                method="POST">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Rimuovi recensione</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Scrivi una recensione -->
            <div class="text-center mt-4">
                <a th:if="${!alreadyReviewed}" th:href="@{'/book/' + ${book.id} + '/review'}"
                    class="btn btn-outline-dark btn-lg px-4">
                    ✍️ Scrivi una recensione
                </a>
                <p th:if="${alreadyReviewed}" class="text-muted mt-2">
                    ✅ Hai già scritto una recensione per questo libro.
                </p>
            </div>

        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
