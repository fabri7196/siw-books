<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="it">

<head>
    <meta charset="UTF-8">
    <title>MyReviews-SiwBooks</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container-fluid background-overlay min-vh-100 m-0">
        <h2 th:if="${nameUser == null}" class="mb-4" style="padding-top: 1rem;">Le mie recensioni ✍️</h2>
        <h2 th:if="${nameUser != null}" class="mb-4" style="padding-top: 1rem;" th:text="'Le recensioni di ' + ${nameUser} + ' ✍️'">Le recensioni di [username] ✍️</h2>

        <div th:if="${#lists.isEmpty(reviews)}" class="alert alert-info">
            Non hai ancora scritto nessuna recensione.
        </div>

        <div class="row row-cols-1 g-4 mb-2" th:each="review : ${reviews}">
            <div class="col">
                <div class="card shadow-sm border rounded p-3">
                    <h5 th:text="${review.title}" class="fw-bold mb-2">Titolo recensione</h5>
                    <p th:text="${review.text}" class="mb-3">Testo recensione</p>

                    <!-- Stelle voto -->
                    <div class="mb-2">
                        <span th:each="i : ${#numbers.sequence(1,5)}">
                            <svg th:if="${i <= review.vote}" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                fill="#FFD700" class="bi bi-star-fill">
                                <path
                                    d="M3.612 15.443c-.396.198-.86-.106-.746-.592l.83-4.73L.173 6.765c-.329-.32-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.63.282.95l-3.523 3.356.83 4.73c.114.486-.35.79-.746.592L8 13.187l-4.389 2.256z" />
                            </svg>
                            <svg th:if="${i > review.vote}" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                fill="#ccc" class="bi bi-star">
                                <path
                                    d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.389 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.522-3.356c.33-.32.16-.888-.282-.95l-4.898-.696-2.184-4.327c-.197-.39-.73-.39-.927 0L5.354 6.118l-4.898.696c-.441.062-.612.63-.283.95l3.523 3.356-.83 4.73z" />
                            </svg>
                        </span>
                    </div>

                    <p class="text-muted">
                        Libro: <a th:href="@{'/book/' + ${review.book.id}}" th:text="${review.book.title}"
                            class="text-decoration-none"></a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
