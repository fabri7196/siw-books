<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aggiungi nuovo libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header th:replace="fragments/header :: header"></header>
    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card shadow-lg rounded-4">
                        <div class="card-body">
                            <h2 class="card-title text-center mb-4">Aggiungi Nuovo Libro</h2>
                            <form method="POST" th:action="@{/book}" th:object="${book}"
                                enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Titolo</label>
                                    <input required type="text" class="form-control" id="title" th:field="${book.title}" />
                                </div>
                                <div class="mb-3">
                                    <label for="year" class="form-label">Anno di pubblicazione</label>
                                    <input required type="text" class="form-control" id="year" th:field="${book.year_pubblication}" />
                                </div>
                                <div class="mb-3">
                                    <label for="code" class="form-label">Codice</label>
                                    <input required type="number" class="form-control" id="code" th:field="${book.code}" />
                                </div>
                                <!-- <div class="mb-3">
                                    <label for="images" class="form-label">Immagini del libro</label>
                                    <input type="file" class="form-control" id="images" multiple accept="image/*" th:field="${book.covers}"/>
                                </div> -->
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Aggiungi Libro</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
