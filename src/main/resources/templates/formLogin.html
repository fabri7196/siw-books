<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- <header th:replace="fragments/header :: header"></header> -->
    <main class="d-flex align-items-center justify-content-center">
        <div class="container mt-4">
            <div class="row justify-content-center min-vh-100 d-flex align-items-center">
                <div class="col-md-4">
                    <div class="card shadow rounded-3">
                        <div class="card-header text-center">
                            <h4>Login</h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/login}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" name="username" class="form-control" id="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" name="password" class="form-control" id="password" required>
                                </div>
                                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                                    Invalid username or password.
                                </div>
                                <button type="submit" class="btn btn-primary w-100" th:href="@{/}">Login</button>
                                <a th:href="@{/register}" class="btn btn-outline-secondary w-100 mt-2">Registrati</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- <footer th:replace="fragments/footer :: footer"></footer> -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

</body>

</html>
